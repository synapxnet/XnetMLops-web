---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xnet-mlops-web-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xnet-mlops-web
  template:
    metadata:
      labels:
        app: xnet-mlops-web
    spec:
      containers:
      - name: web-containers
        image: 192.168.10.132/library/xnet-mlops-web:latest
        ports:
        - - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: xnet-mlops-web-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30080
  selector:
    app: xnet-mlops-web